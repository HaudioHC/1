# .github/workflows/civitai_downloader.yml
name: Civitai Creator Image Downloader

on:
  workflow_dispatch:
    inputs:
      creator_username:
        description: 'Creator Username (创作者用户名, 多个用英文逗号隔开, 如 user1,user2,user3)'
        required: true
        default: 'civitai'
      nsfw_level:
        description: 'NSFW Level (NSFW 等级)'
        type: choice
        required: true
        default: 'X'
        options:
          - 'All (所有等级)'
          - 'None (仅限安全)'
          - 'Soft'
          - 'Mature'
          - 'X'
      sort_by:
        description: 'Sort Order (排序方式)'
        type: choice
        required: true
        default: 'Newest'
        options:
          - 'Newest'
          - 'Most Reactions'
          - 'Most Comments'
      time_period:
        description: 'Time Period for Sort (排序时间范围)'
        type: choice
        required: true
        default: 'AllTime'
        options:
          - 'AllTime'
          - 'Year'
          - 'Month'
          - 'Week'
          - 'Day'
      page_limit:
        description: 'Page Size / Limit (每页数量, 1-200)'
        type: number
        default: 100
      download_threads:
        description: 'Download Threads (单用户下载线程数, 1-32)'
        type: number
        default: 10
      jpeg_quality:
        description: 'JPEG Quality (JPEG 质量, 1-95)'
        type: number
        default: 92
      scan_passes:
        description: 'Scan Passes (列表扫描轮数, 取并集, 1-10)'
        type: number
        default: 3
      download_retries:
        description: 'Download Retries (下载失败重试次数, 0-10)'
        type: number
        default: 3

# 上传 Release 需要写权限
permissions:
  contents: write

# 同一次运行不允许并发, 免得两个 run 抢同一个 Release tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  download-images:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 逐个创作者下载 → 打包 → 上传 Release(边下边清, 避免磁盘写满)
        env:
          GH_TOKEN: ${{ github.token }}
          USERS: ${{ github.event.inputs.creator_username || 'civitai' }}
          # 原始输入, 如 'All (所有等级)'；由 download_batch.py 取出首词并校验
          NSFW: ${{ github.event.inputs.nsfw_level }}
          SORT: ${{ github.event.inputs.sort_by || 'Newest' }}
          PERIOD: ${{ github.event.inputs.time_period || 'AllTime' }}
          LIMIT: ${{ github.event.inputs.page_limit || 100 }}
          THREADS: ${{ github.event.inputs.download_threads || 10 }}
          JPEG_QUALITY: ${{ github.event.inputs.jpeg_quality || 92 }}
          SCAN_PASSES: ${{ github.event.inputs.scan_passes || 3 }}
          DOWNLOAD_RETRIES: ${{ github.event.inputs.download_retries || 3 }}
          OUTPUT_DIR: ./output
          RELEASE_TAG: civitai-${{ github.run_id }}
          RELEASE_TITLE: Civitai Creator Images
          RELEASE_NOTES: |
            - 创作者: ${{ github.event.inputs.creator_username || 'civitai' }}
            - NSFW 等级: ${{ github.event.inputs.nsfw_level || 'X' }}
            - 排序: ${{ github.event.inputs.sort_by || 'Newest' }} / ${{ github.event.inputs.time_period || 'AllTime' }}
            - 触发人: ${{ github.actor }}
            - 压缩包: 每个创作者独立分卷 `civitai-<创作者>-images.zip`, 超过 2GiB 自动拆成 `-part2`、`-part3`
            - 说明: 每个创作者上传完成后立即删除本地文件, 避免 runner 磁盘写满
            - 注意: 若某个创作者被跳过, 通常是用户名不存在, 或该 NSFW 等级/排序下没有图片
        run: |
          df -h / | tail -1
          python download_batch.py
          df -h / | tail -1
